<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="160" viewBox="0 0 1000 160">
  <defs>
    <linearGradient id="cardB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1d3a"/>
      <stop offset="100%" stop-color="#050a16"/>
    </linearGradient>
    <linearGradient id="cardR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a0f12"/>
      <stop offset="100%" stop-color="#0a0505"/>
    </linearGradient>
    <filter id="g2"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1000" height="160" fill="#02040a"/>
  <line x1="0" y1="130" x2="1000" y2="130" stroke="#1e3a8a" stroke-width="1" opacity="0.6"/>

  <g font-family="Consolas, monospace" font-size="15" text-anchor="middle" font-weight="700">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="3.2s" repeatCount="indefinite"/>
      <rect x="40" y="36" width="160" height="62" rx="12" fill="url(#cardB)" stroke="#3b82f6" stroke-width="1.5" filter="url(#g2)"/>
      <text x="120" y="73" fill="#93c5fd">Python</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="3.2s" begin="0.4s" repeatCount="indefinite"/>
      <rect x="220" y="36" width="160" height="62" rx="12" fill="url(#cardR)" stroke="#ef4444" stroke-width="1.5" filter="url(#g2)"/>
      <text x="300" y="73" fill="#fca5a5">Java</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="3.2s" begin="0.8s" repeatCount="indefinite"/>
      <rect x="400" y="36" width="160" height="62" rx="12" fill="url(#cardB)" stroke="#3b82f6" stroke-width="1.5" filter="url(#g2)"/>
      <text x="480" y="73" fill="#93c5fd">VS Code</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="3.2s" begin="1.2s" repeatCount="indefinite"/>
      <rect x="580" y="36" width="160" height="62" rx="12" fill="url(#cardR)" stroke="#ef4444" stroke-width="1.5" filter="url(#g2)"/>
      <text x="660" y="73" fill="#fca5a5">Git / GitHub</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
      <rect x="760" y="36" width="160" height="62" rx="12" fill="url(#cardB)" stroke="#3b82f6" stroke-width="1.5" filter="url(#g2)"/>
      <text x="840" y="73" fill="#93c5fd">IA</text>
    </g>
  </g>
</svg>
