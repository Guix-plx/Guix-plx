<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280">
  <defs>
    <radialGradient id="planet" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="45%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="atmo" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.45"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" x2="1">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f87171" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1000" height="280" fill="#02040a"/>

  <!-- campo de estrelas com cintilação -->
  <g fill="#e5e7eb">
    <circle cx="40" cy="30" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="90" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="25" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="200" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="40" r="1.2"><animate attributeName="opacity" values="1;0.3;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="235" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="60" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="170" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="240" r="1.1"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="120" r="0.9"/>
    <circle cx="250" cy="150" r="0.9"/>
    <circle cx="900" cy="250" r="1"/>
  </g>

  <!-- planeta girando, com anel -->
  <g transform="translate(860 140)">
    <circle r="78" fill="url(#atmo)"/>
    <circle r="62" fill="url(#planet)"/>
    <ellipse rx="110" ry="22" fill="none" stroke="url(#ring)" stroke-width="10" transform="rotate(-18)">
      <animateTransform attributeName="transform" type="rotate" values="-18;-14;-18" dur="8s" repeatCount="indefinite" additive="sum"/>
    </ellipse>
    <!-- lua orbitando -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
      <circle cx="105" cy="0" r="7" fill="#f87171"/>
      <circle cx="104" cy="-2" r="2" fill="#fee2e2" opacity="0.8"/>
    </g>
  </g>

  <!-- órbita -->
  <ellipse cx="860" cy="140" rx="150" ry="38" fill="none" stroke="#1e3a8a" stroke-width="1" stroke-dasharray="3 5" opacity="0.7"/>

  <!-- título -->
  <text x="60" y="130" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="700" fill="url(#title)" filter="url(#glow)">
    Guilherme Almeida
    <animate attributeName="opacity" values="0;1" dur="1.4s" fill="freeze"/>
  </text>
  <text x="62" y="170" font-family="Consolas, monospace" font-size="18" fill="#60a5fa">
    &gt; dev full-stack · IA para resolver problemas complexos_
  </text>
  <rect x="62" y="190" width="260" height="3" fill="#ef4444">
    <animate attributeName="width" values="0;260" dur="1.6s" fill="freeze"/>
  </rect>
  <text x="62" y="225" font-family="Consolas, monospace" font-size="14" fill="#6b7280">Ciência da Computação · Python · Java · Git</text>
</svg>
